/* ---------------- tiny hand-drawn icon set (no external deps) ---------------- */
const Svg = ({ children, size = 18, color = "currentColor" }) => (
  <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
    {children}
  </svg>
);
const IconHome = (p) => <Svg {...p}><path d="M3 11l9-8 9 8" /><path d="M5 10v10h5v-6h4v6h5V10" /></Svg>;
const IconPackage = (p) => <Svg {...p}><path d="M3 8l9-4 9 4-9 4-9-4z" /><path d="M3 8v9l9 4 9-4V8" /><path d="M12 12v9" /></Svg>;
const IconCart = (p) => <Svg {...p}><circle cx="9" cy="20" r="1.4" fill={p.color || "currentColor"} stroke="none" /><circle cx="18" cy="20" r="1.4" fill={p.color || "currentColor"} stroke="none" /><path d="M2 3h2l2.6 12.4a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H6" /></Svg>;
const IconMore = (p) => <Svg {...p}><circle cx="5" cy="12" r="1.5" fill={p.color || "currentColor"} stroke="none" /><circle cx="12" cy="12" r="1.5" fill={p.color || "currentColor"} stroke="none" /><circle cx="19" cy="12" r="1.5" fill={p.color || "currentColor"} stroke="none" /></Svg>;
const IconChevronLeft = (p) => <Svg {...p}><path d="M15 18l-6-6 6-6" /></Svg>;
const IconChevronRight = (p) => <Svg {...p}><path d="M9 6l6 6-6 6" /></Svg>;
const IconPlus = (p) => <Svg {...p}><path d="M12 5v14M5 12h14" /></Svg>;
const IconMinus = (p) => <Svg {...p}><path d="M5 12h14" /></Svg>;
const IconCheck = (p) => <Svg {...p}><path d="M20 6L9 17l-5-5" /></Svg>;
const IconSearch = (p) => <Svg {...p}><circle cx="11" cy="11" r="7" /><path d="M21 21l-4.35-4.35" /></Svg>;

/* ---------------- shared bits ---------------- */
function Chip({ active, children, onClick, color = C.teal, soft = C.tealSoft }) {
  return (
    <button onClick={onClick} className="whitespace-nowrap rounded-full px-3 py-1.5 text-xs font-medium transition-colors"
      style={active ? { backgroundColor: color, color: "#fff" } : { backgroundColor: soft, color }}>
      {children}
    </button>
  );
}
function Badge({ color, bg, children }) {
  return <span className="rounded-md px-2 py-0.5 text-[11px] font-semibold shrink-0" style={{ color, backgroundColor: bg }}>{children}</span>;
}
function Fill({ pct, color }) {
  const p = Math.max(4, Math.min(100, pct));
  return (
    <div className="h-1.5 w-full rounded-full" style={{ backgroundColor: "#EEF1EA" }}>
      <div className="h-1.5 rounded-full transition-all duration-700" style={{ width: `${p}%`, backgroundColor: color }} />
    </div>
  );
}
function ScreenHeader({ title, onBack, right }) {
  return (
    <div className="flex items-center justify-between px-4 py-4 shrink-0" style={{ borderBottom: `1px solid ${C.border}`, backgroundColor: C.card }}>
      <div className="flex items-center gap-2 min-w-0">
        {onBack ? (
          <button onClick={onBack} className="p-1 -ml-1 rounded-full active:bg-black/5">
            <IconChevronLeft size={20} color={C.ink} />
          </button>
        ) : <div className="w-1" />}
        <h1 className="text-[17px] font-bold truncate" style={{ color: C.ink }}>{title}</h1>
      </div>
      <div className="shrink-0">{right}</div>
    </div>
  );
}

  { id: 2, name: "LG 洗衣機", model: "WT-VD123", emoji: "🧺", status: "待維修", statusColor: C.coral, statusBg: C.coralSoft, purchase: "2024/02/10" },
  { id: 3, name: "日立冷氣", model: "RAS-50YK", emoji: "❄️", status: "保固內", statusColor: C.teal, statusBg: C.tealSoft, purchase: "2022/06/20" },
  { id: 4, name: "Samsung 電視", model: "QA65Q80A", emoji: "📺", status: "保固內", statusColor: C.teal, statusBg: C.tealSoft, purchase: "2023/05/05" },
];
const repairsByAppliance = {

    { date: "2026/08/21", desc: "無法脫水", cost: "$2,000", status: "處理中", vendor: "等待維修報價" },

  { name: "洗衣機濾網", emoji: "🧺", cycle: "建議每 2 個月更換", next: "2026/10/05", left: "剩 44 天", status: "正常" },

  { id: 2, name: "洗衣精", qty: "1 瓶", cat: "清潔用品", emoji: "🧴", checked: true, store: "日用品" },
  { id: 3, name: "雞蛋", qty: "1 盒", cat: "食品", emoji: "🥚", checked: false, store: "超市" },
  { id: 4, name: "牛奶", qty: "2 瓶", cat: "食品", emoji: "🥛", checked: false, store: "超市" },
  { id: 5, name: "垃圾袋", qty: "1 包", cat: "清潔用品", emoji: "🗑️", checked: false, store: "日用品" },
  { id: 6, name: "泡麵", qty: "2 包", cat: "食品", emoji: "🍜", checked: false, store: "Costco" },
];

/* ---------------- screens ---------------- */
function StatCard({ emoji, label, value, unit, note, color, bg, onClick }) {
  return (
    <button onClick={onClick} className="rounded-2xl p-4 text-left active:scale-[0.98] transition-transform"
      style={{ backgroundColor: C.card, border: `1px solid ${C.border}`, borderLeft: `4px solid ${color}` }}>
      <div className="w-8 h-8 rounded-lg flex items-center justify-center text-sm mb-2" style={{ backgroundColor: bg }}>{emoji}</div>
      <p className="text-[12px]" style={{ color: C.sub }}>{label}</p>
      <p className="text-[22px] font-extrabold leading-tight mt-0.5" style={{ color: C.ink }}>
        {value}<span className="text-[12px] font-medium ml-0.5" style={{ color: C.sub }}>{unit}</span>
      </p>
      <p className="text-[11px] font-semibold mt-1" style={{ color }}>{note}</p>
    </button>
  );
}

function HomeScreen({ goTab }) {
  return (
    <div className="flex-1 overflow-y-auto" style={{ backgroundColor: C.bg }}>
      <div className="px-4 pt-5 pb-3">
        <div className="flex items-center justify-between">
          <div>
            <p className="text-[13px]" style={{ color: C.sub }}>早安 👋</p>
            <h2 className="text-[20px] font-bold mt-0.5" style={{ color: C.ink }}>我的家</h2>
          </div>
          <button className="relative p-2 rounded-full" style={{ backgroundColor: C.card }}>
            <span style={{ fontSize: 16 }}>🔔</span>
            <span className="absolute -top-0.5 -right-0.5 w-4 h-4 rounded-full text-[10px] font-bold text-white flex items-center justify-center" style={{ backgroundColor: C.coral }}>4</span>
          </button>
        </div>
        <p className="text-[13px] mt-3" style={{ color: C.sub }}>今天有 <span className="font-semibold" style={{ color: C.coral }}>4</span> 件事情需要注意喔</p>
      </div>
      <div className="grid grid-cols-2 gap-3 px-4">
        <StatCard emoji="🥬" label="冰箱庫存" value="12" unit="項" note="2 項低庫存" color={C.teal} bg={C.tealSoft} onClick={() => goTab("inventory", "fridge")} />
        <StatCard emoji="🧻" label="日用品庫存" value="8" unit="項" note="3 項低庫存" color={C.blue} bg={C.blueSoft} onClick={() => goTab("inventory", "daily")} />
        <StatCard emoji="🔧" label="待更換耗材" value="3" unit="項" note="1 週內到期" color={C.amber} bg={C.amberSoft} onClick={() => goTab("appliance", null, "consumables")} />
        <StatCard emoji="🛠️" label="待維修家電" value="2" unit="件" note="1 件處理中" color={C.coral} bg={C.coralSoft} onClick={() => goTab("appliance")} />
      </div>
      <div className="px-4 mt-6">
        <div className="flex items-center justify-between mb-2">
          <h3 className="text-[15px] font-bold" style={{ color: C.ink }}>最近需要處理</h3>
          <span className="text-[12px] font-medium" style={{ color: C.teal }}>查看全部</span>
        </div>
        <div className="rounded-2xl overflow-hidden" style={{ backgroundColor: C.card, border: `1px solid ${C.border}` }}>
          {todo.map((t, i) => (
            <div key={i} className="flex items-center gap-3 px-4 py-3" style={i !== todo.length - 1 ? { borderBottom: `1px solid ${C.border}` } : {}}>
              <div className="w-9 h-9 rounded-xl flex items-center justify-center text-base shrink-0" style={{ backgroundColor: C.bg }}>{t.emoji}</div>
              <div className="flex-1 min-w-0">
                <p className="text-[14px] font-semibold truncate" style={{ color: C.ink }}>{t.title}</p>
                <p className="text-[12px]" style={{ color: C.sub }}>{t.sub}</p>
              </div>
              <span className="text-[12px] font-semibold shrink-0" style={{ color: t.tag }}>{t.due}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="px-4 mt-6 pb-6">
        <div className="flex items-center justify-between mb-2">

          <span className="text-[12px] font-medium" style={{ color: C.teal }}>查看全部</span>
        </div>
        <div className="rounded-2xl px-4 py-3 flex items-center gap-3" style={{ backgroundColor: C.card, border: `1px solid ${C.border}` }}>

function InventoryScreen({ category, setCategory, openItem }) {
  const [filter, setFilter] = useState("all");
  const items = category === "fridge" ? fridgeItems : dailyItems;
  const low = items.filter((i) => i.status === "低庫存").length;
  const soon = items.filter((i) => i.status === "即將到期").length;
  const filtered = items.filter((i) => filter === "low" ? i.status === "低庫存" : filter === "soon" ? i.status === "即將到期" : true);
  return (
    <div className="flex-1 overflow-y-auto" style={{ backgroundColor: C.bg }}>
      <div className="px-4 pt-4">
        <div className="flex rounded-full p-1" style={{ backgroundColor: C.card, border: `1px solid ${C.border}` }}>
          {[["fridge", "冰箱庫存"], ["daily", "日用品庫存"]].map(([k, label]) => (
            <button key={k} onClick={() => setCategory(k)} className="flex-1 rounded-full py-1.5 text-[13px] font-semibold transition-colors"
              style={category === k ? { backgroundColor: C.teal, color: "#fff" } : { color: C.sub }}>{label}</button>
          ))}
        </div>
      </div>
      <div className="px-4 mt-3">
        <div className="flex items-center gap-2 rounded-xl px-3 py-2.5" style={{ backgroundColor: C.card, border: `1px solid ${C.border}` }}>
          <IconSearch size={16} color={C.faint} />
          <span className="text-[13px]" style={{ color: C.faint }}>搜尋商品</span>
        </div>
      </div>
      <div className="px-4 mt-3 flex gap-2">
        <Chip active={filter === "all"} onClick={() => setFilter("all")}>全部 ({items.length})</Chip>
        <Chip active={filter === "low"} onClick={() => setFilter("low")} color={C.coral} soft={C.coralSoft}>低庫存 ({low})</Chip>
        <Chip active={filter === "soon"} onClick={() => setFilter("soon")} color={C.amber} soft={C.amberSoft}>即將到期 ({soon})</Chip>
      </div>
      <div className="px-4 mt-3 pb-24 space-y-2.5">
        {filtered.map((it) => (
          <button key={it.id} onClick={() => openItem(it)} className="w-full text-left rounded-2xl p-3.5 flex items-center gap-3 active:scale-[0.99] transition-transform"
            style={{ backgroundColor: C.card, border: `1px solid ${C.border}` }}>
            <div className="w-12 h-12 rounded-xl flex items-center justify-center text-xl shrink-0" style={{ backgroundColor: C.bg }}>{it.emoji}</div>
            <div className="flex-1 min-w-0">
              <div className="flex items-center justify-between gap-2">
                <p className="text-[14px] font-bold truncate" style={{ color: C.ink }}>{it.name}</p>
                <Badge color={it.statusColor} bg={it.statusBg}>{it.status}</Badge>
              </div>
              <p className="text-[12px] mt-0.5" style={{ color: C.sub }}>{it.qty}{it.unit} / 最低庫存 {it.min}{it.unit}</p>
              <div className="flex items-center gap-2 mt-1.5">
                <div className="flex-1"><Fill pct={it.pct} color={it.statusColor} /></div>
                <span className="text-[11px] font-semibold shrink-0" style={{ color: C.sub }}>{it.pct}%</span>
              </div>
            </div>
          </button>
        ))}
      </div>
    </div>
  );
}

function ItemDetail({ item }) {
  const [qty, setQty] = useState(item.qty);
  const pct = Math.round((qty / item.min) * 100);
  return (
    <div className="flex-1 overflow-y-auto" style={{ backgroundColor: C.bg }}>
      <div className="px-4 pt-5 pb-4" style={{ backgroundColor: C.card, borderBottom: `1px solid ${C.border}` }}>
        <div className="flex items-center gap-4">
          <div className="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl" style={{ backgroundColor: C.bg }}>{item.emoji}</div>
          <div className="flex-1">
            <div className="flex items-center gap-2">
              <h2 className="text-[19px] font-extrabold" style={{ color: C.ink }}>{item.name}</h2>
              <Badge color={item.statusColor} bg={item.statusBg}>{item.status}</Badge>
            </div>
            <p className="text-[13px] mt-0.5" style={{ color: C.sub }}>{qty} {item.unit}　最低庫存 {item.min} {item.unit}</p>
          </div>
        </div>
        <div className="mt-3"><Fill pct={pct} color={item.statusColor} /></div>
      </div>
      <div className="px-4 mt-4">
        <div className="rounded-2xl overflow-hidden" style={{ backgroundColor: C.card, border: `1px solid ${C.border}` }}>
          {[["存放位置", item.location], ["有效期限", item.expiry || "—"], ["上次購買", item.lastBuy || "—"], ["平均消耗", item.avg], ["預估還可使用", item.left]].map(([label, val], i, arr) => (
            <div key={label} className="flex items-center justify-between px-4 py-3" style={i !== arr.length - 1 ? { borderBottom: `1px solid ${C.border}` } : {}}>
              <span className="text-[13px]" style={{ color: C.sub }}>{label}</span>
              <span className="text-[13px] font-semibold" style={{ color: C.ink }}>{val}</span>
            </div>
          ))}
        </div>
      </div>
      <div className="px-4 mt-4 pb-24">
        <div className="rounded-2xl p-4 flex items-center justify-center gap-6" style={{ backgroundColor: C.card, border: `1px solid ${C.border}` }}>
          <button onClick={() => setQty((q) => Math.max(0, q - 1))} className="w-11 h-11 rounded-full flex items-center justify-center active:scale-95 transition-transform" style={{ backgroundColor: C.tealSoft }}><IconMinus size={18} color={C.teal} /></button>
          <span className="text-[26px] font-extrabold w-12 text-center" style={{ color: C.ink }}>{qty}</span>
          <button onClick={() => setQty((q) => q + 1)} className="w-11 h-11 rounded-full flex items-center justify-center active:scale-95 transition-transform" style={{ backgroundColor: C.teal }}><IconPlus size={18} color="#fff" /></button>
        </div>
        <div className="grid grid-cols-2 gap-3 mt-3">
          <button className="rounded-xl py-3 text-[13px] font-semibold" style={{ backgroundColor: C.tealSoft, color: C.teal }}>使用紀錄</button>
          <button className="rounded-xl py-3 text-[13px] font-semibold" style={{ backgroundColor: C.tealSoft, color: C.teal }}>購買紀錄</button>
        </div>
      </div>
    </div>
  );
}

function EmptyRow({ text }) {
  return (
    <div className="rounded-2xl py-10 flex flex-col items-center justify-center" style={{ backgroundColor: C.card, border: `1px dashed ${C.border}` }}>
      <p className="text-[13px]" style={{ color: C.faint }}>{text}</p>
    </div>
  );
}

function ApplianceListScreen({ openAppliance, initialConsumables }) {
  const [filter, setFilter] = useState(initialConsumables ? "consumables" : "all");
  return (
    <div className="flex-1 overflow-y-auto" style={{ backgroundColor: C.bg }}>
      <div className="px-4 pt-4 flex gap-2">
        <Chip active={filter === "all"} onClick={() => setFilter("all")}>家電清單</Chip>
        <Chip active={filter === "consumables"} onClick={() => setFilter("consumables")} color={C.amber} soft={C.amberSoft}>耗材更換提醒</Chip>
      </div>
      {filter === "consumables" ? (
        <div className="px-4 mt-3 pb-24 space-y-2.5">
          {allConsumables.map((c, i) => (
            <div key={i} className="rounded-2xl p-3.5 flex items-center gap-3" style={{ backgroundColor: C.card, border: `1px solid ${C.border}` }}>
              <div className="w-11 h-11 rounded-xl flex items-center justify-center text-lg shrink-0" style={{ backgroundColor: C.bg }}>{c.emoji}</div>
              <div className="flex-1 min-w-0">
                <p className="text-[14px] font-bold" style={{ color: C.ink }}>{c.name}</p>
                <p className="text-[12px] mt-0.5" style={{ color: C.sub }}>{c.cycle}　下次 {c.next}</p>
              </div>
              <Badge color={c.status === "即將到期" ? C.amber : C.teal} bg={c.status === "即將到期" ? C.amberSoft : C.tealSoft}>{c.left}</Badge>
            </div>
          ))}
        </div>
      ) : (
        <div className="px-4 mt-3 pb-24 space-y-2.5">
          {appliances.map((a) => (
            <button key={a.id} onClick={() => openAppliance(a)} className="w-full text-left rounded-2xl p-3.5 flex items-center gap-3 active:scale-[0.99] transition-transform" style={{ backgroundColor: C.card, border: `1px solid ${C.border}` }}>
              <div className="w-12 h-12 rounded-xl flex items-center justify-center text-xl shrink-0" style={{ backgroundColor: C.bg }}>{a.emoji}</div>
              <div className="flex-1 min-w-0">
                <div className="flex items-center justify-between gap-2">
                  <p className="text-[14px] font-bold truncate" style={{ color: C.ink }}>{a.name}</p>
                  <Badge color={a.statusColor} bg={a.statusBg}>{a.status}</Badge>
                </div>
                <p className="text-[12px] mt-0.5" style={{ color: C.sub }}>{a.model}</p>
                <p className="text-[11px] mt-0.5" style={{ color: C.faint }}>購入於 {a.purchase}</p>
              </div>
              <IconChevronRight size={16} color={C.faint} />
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function ApplianceDetail({ appliance }) {
  const [tab, setTab] = useState("repair");
  const repairs = repairsByAppliance[appliance.id] || [];
  const consumables = consumablesByAppliance[appliance.id] || [];
  return (
    <div className="flex-1 overflow-y-auto" style={{ backgroundColor: C.bg }}>
      <div className="px-4 pt-5 pb-4" style={{ backgroundColor: C.card, borderBottom: `1px solid ${C.border}` }}>
        <div className="flex items-center gap-4">
          <div className="w-16 h-16 rounded-2xl flex items-center justify-center text-3xl" style={{ backgroundColor: C.bg }}>{appliance.emoji}</div>
          <div>
            <h2 className="text-[19px] font-extrabold" style={{ color: C.ink }}>{appliance.name}</h2>
            <p className="text-[13px] mt-0.5" style={{ color: C.sub }}>{appliance.model}</p>
          </div>
        </div>
      </div>
      <div className="px-4 pt-3 flex gap-2">
        {[["repair", "維修紀錄", "🔧"], ["consumable", "耗材更換", "⏱️"], ["doc", "文件", "📄"]].map(([k, label, emo]) => (
          <button key={k} onClick={() => setTab(k)} className="flex items-center gap-1.5 rounded-full px-3 py-1.5 text-[13px] font-semibold"
            style={tab === k ? { backgroundColor: C.teal, color: "#fff" } : { backgroundColor: C.card, color: C.sub, border: `1px solid ${C.border}` }}>
            <span style={{ fontSize: 12 }}>{emo}</span>{label}
          </button>
        ))}
      </div>
      <div className="px-4 mt-3 pb-24">
        {tab === "repair" && (repairs.length ? (
          <div className="space-y-3">
            {repairs.map((r, i) => (
              <div key={i} className="rounded-2xl p-4" style={{ backgroundColor: C.card, border: `1px solid ${C.border}` }}>
                <div className="flex items-center justify-between">
                  <span className="text-[13px] font-semibold" style={{ color: C.sub }}>{r.date}</span>
                  <Badge color={r.status === "處理中" ? C.coral : C.teal} bg={r.status === "處理中" ? C.coralSoft : C.tealSoft}>{r.status}</Badge>
                </div>
                <p className="text-[14px] font-bold mt-1.5" style={{ color: C.ink }}>{r.desc}</p>
                <div className="flex items-center justify-between mt-1.5">
                  <span className="text-[12px]" style={{ color: C.faint }}>{r.vendor}</span>
                  <span className="text-[13px] font-semibold" style={{ color: C.ink }}>{r.cost}</span>
                </div>
              </div>
            ))}
          </div>
        ) : <EmptyRow text="目前沒有維修紀錄" />)}
        {tab === "consumable" && (consumables.length ? (
          <div className="space-y-3">
            {consumables.map((c, i) => (
              <div key={i} className="rounded-2xl p-3.5 flex items-center gap-3" style={{ backgroundColor: C.card, border: `1px solid ${C.border}` }}>
                <div className="w-11 h-11 rounded-xl flex items-center justify-center text-lg shrink-0" style={{ backgroundColor: C.bg }}>{c.emoji}</div>
                <div className="flex-1">
                  <p className="text-[14px] font-bold" style={{ color: C.ink }}>{c.name}</p>
                  <p className="text-[12px] mt-0.5" style={{ color: C.sub }}>{c.cycle}　下次 {c.next}</p>
                </div>
                <Badge color={c.status === "即將到期" ? C.amber : C.teal} bg={c.status === "即將到期" ? C.amberSoft : C.tealSoft}>{c.left}</Badge>
              </div>
            ))}
          </div>
        ) : <EmptyRow text="目前沒有耗材提醒" />)}
        {tab === "doc" && <EmptyRow text="尚未上傳保固卡或說明書" />}
      </div>
    </div>
  );
}

function PurchaseScreen() {
  const [items, setItems] = useState(purchaseSeed);
  const [filter, setFilter] = useState("全部");
  const [justAdded, setJustAdded] = useState(false);
  const toggle = (id) => setItems((prev) => prev.map((it) => (it.id === id ? { ...it, checked: !it.checked } : it)));
  const checkedCount = items.filter((i) => i.checked).length;
  const filtered = filter === "全部" ? items : items.filter((i) => i.store === filter);
  const stores = ["全部", "超市", "日用品", "Costco"];
  return (
    <div className="flex-1 overflow-y-auto flex flex-col" style={{ backgroundColor: C.bg }}>
      <div className="px-4 pt-4 flex gap-2 overflow-x-auto">
        {stores.map((s) => {
          const count = s === "全部" ? items.length : items.filter((i) => i.store === s).length;
          return <Chip key={s} active={filter === s} onClick={() => setFilter(s)}>{s} ({count})</Chip>;
        })}
      </div>
      <div className="px-4 mt-3 pb-28 space-y-2.5 flex-1">
        {filtered.map((it) => (
          <button key={it.id} onClick={() => toggle(it.id)} className="w-full flex items-center gap-3 rounded-2xl p-3.5 text-left active:scale-[0.99] transition-transform" style={{ backgroundColor: C.card, border: `1px solid ${C.border}` }}>
            <div className="w-6 h-6 rounded-md flex items-center justify-center shrink-0 transition-colors" style={it.checked ? { backgroundColor: C.teal } : { border: `1.5px solid ${C.border}` }}>
              {it.checked && <IconCheck size={14} color="#fff" />}
            </div>
            <div className="w-10 h-10 rounded-xl flex items-center justify-center text-lg shrink-0" style={{ backgroundColor: C.bg }}>{it.emoji}</div>
            <div className="flex-1 min-w-0">
              <p className="text-[14px] font-semibold" style={{ color: it.checked ? C.faint : C.ink, textDecoration: it.checked ? "line-through" : "none" }}>{it.name}</p>
              <p className="text-[12px]" style={{ color: C.sub }}>{it.qty}　{it.cat}</p>
            </div>
          </button>
        ))}
      </div>
      <div className="px-4 pb-5 pt-2 sticky bottom-0" style={{ backgroundColor: C.bg }}>
        <button onClick={() => { setJustAdded(true); setTimeout(() => setJustAdded(false), 1400); }} disabled={checkedCount === 0}
          className="w-full rounded-2xl py-3.5 text-[15px] font-bold text-white transition-colors disabled:opacity-40" style={{ backgroundColor: justAdded ? C.tealDeep : C.teal }}>
          {justAdded ? "已加入購物車 ✓" : `加入購物車 (${checkedCount})`}
        </button>
      </div>
    </div>
  );
}

function MoreScreen() {
  const rows = [
    { emoji: "👪", label: "家庭成員" }, { emoji: "🔔", label: "通知設定" },
    { emoji: "⚙️", label: "一般設定" }, { emoji: "❓", label: "使用說明" },
  ];
  return (
    <div className="flex-1 overflow-y-auto" style={{ backgroundColor: C.bg }}>
      <div className="px-4 pt-5">
        <div className="rounded-2xl p-4 flex items-center gap-3" style={{ backgroundColor: C.card, border: `1px solid ${C.border}` }}>
          <div className="w-12 h-12 rounded-full flex items-center justify-center text-xl" style={{ backgroundColor: C.tealSoft }}>👤</div>
          <div><p className="text-[15px] font-bold" style={{ color: C.ink }}>陳家的家</p><p className="text-[12px]" style={{ color: C.sub }}>4 位家庭成員</p></div>
        </div>
      </div>
      <div className="px-4 mt-4">
        <div className="rounded-2xl overflow-hidden" style={{ backgroundColor: C.card, border: `1px solid ${C.border}` }}>
          {rows.map((r, i) => (
            <div key={r.label} className="flex items-center gap-3 px-4 py-3.5" style={i !== rows.length - 1 ? { borderBottom: `1px solid ${C.border}` } : {}}>
              <span style={{ fontSize: 16 }}>{r.emoji}</span>
              <span className="flex-1 text-[14px] font-medium" style={{ color: C.ink }}>{r.label}</span>
              <IconChevronRight size={15} color={C.faint} />
            </div>
          ))}
        </div>
      </div>
      <div className="px-4 mt-4 pb-8">
        <button className="w-full flex items-center justify-center gap-2 rounded-2xl py-3 text-[13px] font-semibold" style={{ backgroundColor: C.coralSoft, color: C.coral }}>🚪 登出</button>
      </div>
    </div>
  );
}

/* ---------------- shell ---------------- */
const NAV = [
  { key: "home", label: "首頁", Icon: IconHome },
  { key: "inventory", label: "庫存", Icon: IconPackage },
  { key: "purchase", label: "採購清單", Icon: IconCart },
  { key: "appliance", label: "家電", Icon: (p) => <span style={{ fontSize: p.size || 16 }}>🔧</span> },
  { key: "more", label: "更多", Icon: IconMore },
];

function App() {
  const [tab, setTab] = useState("home");
  const [invCategory, setInvCategory] = useState("fridge");
  const [selectedItem, setSelectedItem] = useState(null);
  const [selectedAppliance, setSelectedAppliance] = useState(null);
  const [applianceView, setApplianceView] = useState(null);

  const goTab = (t, invCat, applianceSub) => {
    setSelectedItem(null); setSelectedAppliance(null); setApplianceView(applianceSub || null);
    if (invCat) setInvCategory(invCat);
    setTab(t);
  };

  const titles = {
    home: "我的家", inventory: selectedItem ? "品項詳情" : "庫存", purchase: "採購清單",
    appliance: selectedAppliance ? selectedAppliance.name : "家電管理", more: "更多",
  };

  return (
    <div className="min-h-screen w-full flex items-center justify-center p-4 sm:p-8" style={{ backgroundColor: "#EDEFE8" }}>
      <div className="w-full flex flex-col overflow-hidden" style={{ maxWidth: 430, height: "min(900px, 92vh)", backgroundColor: C.bg, borderRadius: 32, boxShadow: "0 30px 60px -20px rgba(20,40,30,0.35)", border: `1px solid ${C.border}` }}>
        <ScreenHeader
          title={titles[tab]}
          onBack={(tab === "inventory" && selectedItem && (() => setSelectedItem(null))) || (tab === "appliance" && selectedAppliance && (() => setSelectedAppliance(null))) || null}
          right={
            (tab === "inventory" && !selectedItem) || (tab === "appliance" && !selectedAppliance) || tab === "purchase" ? (
              <span className="flex items-center gap-1 text-[13px] font-semibold" style={{ color: C.teal }}><IconPlus size={13} /> 新增</span>
            ) : null
          }
        />
        {tab === "home" && <HomeScreen goTab={goTab} />}
        {tab === "inventory" && (selectedItem ? <ItemDetail item={selectedItem} /> : <InventoryScreen category={invCategory} setCategory={setInvCategory} openItem={setSelectedItem} />)}
        {tab === "purchase" && <PurchaseScreen />}
        {tab === "appliance" && (selectedAppliance ? <ApplianceDetail appliance={selectedAppliance} /> : <ApplianceListScreen openAppliance={setSelectedAppliance} initialConsumables={applianceView === "consumables"} />)}
        {tab === "more" && <MoreScreen />}
        <div className="flex items-stretch shrink-0" style={{ backgroundColor: C.card, borderTop: `1px solid ${C.border}` }}>
          {NAV.map((n) => {
            const active = tab === n.key;
            return (
              <button key={n.key} onClick={() => goTab(n.key)} className="flex-1 flex flex-col items-center gap-1 py-2.5">
                <n.Icon size={19} color={active ? C.teal : C.faint} />
                <span className="text-[10px] font-semibold" style={{ color: active ? C.teal : C.faint }}>{n.label}</span>
              </button>
            );
          })}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
