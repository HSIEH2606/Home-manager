<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>家管誌 · 家庭一站式管理</title>
<style>
  :root{
    --paper:#FAF7EF;
    --paper-deep:#F1EBDA;
    --ink:#1F3A34;
    --ink-soft:#4B615B;
    --line:#E4DCC6;
    --sage:#4C7A6C;
    --sage-deep:#365A4F;
    --sage-pale:#DCEBE3;
    --coral:#E1552B;
    --coral-pale:#FBE3D8;
    --amber:#C98A20;
    --amber-pale:#F6E7C9;
    --white:#FFFFFF;
    --shadow: 0 10px 30px -14px rgba(31,58,52,0.28);
    --radius: 18px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper-deep);color:var(--ink);}
  body{
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    min-height:100dvh;
  }
  h1,h2,h3{margin:0;font-weight:800;letter-spacing:.01em;}
  p{margin:0;}
  button{font-family:inherit;}
  ::selection{background:var(--sage-pale);}

  /* ---------- App shell ---------- */
  .app{
    max-width:1180px;
    margin:0 auto;
    min-height:100vh;
    min-height:100dvh;
    background:var(--paper);
    display:flex;
  }
  .sidebar{
    display:none;
    width:230px;
    flex-shrink:0;
    background:var(--sage-deep);
    color:#EAF3EE;
    padding:28px 18px;
    flex-direction:column;
    gap:6px;
  }
  .sidebar .brand{
    display:flex;align-items:center;gap:10px;
    padding:0 10px 24px;
    color:#fff;
  }
  .sidebar .brand .mark{
    width:34px;height:34px;border-radius:10px;background:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
  }
  .sidebar .brand span{font-size:19px;font-weight:800;}
  .sidebar .greet{font-size:12.5px;color:#BFD8CC;padding:0 10px 18px;}
  .side-link{
    display:flex;align-items:center;gap:12px;
    padding:11px 12px;border-radius:12px;
    color:#D8EAE1;text-decoration:none;font-size:14.5px;font-weight:600;
    cursor:pointer;border:none;background:transparent;text-align:left;width:100%;
  }
  .side-link svg{width:19px;height:19px;flex-shrink:0;}
  .side-link.active{background:rgba(255,255,255,0.14);color:#fff;}
  .side-link .badge{
    margin-left:auto;background:var(--coral);color:#fff;font-size:11px;
    padding:1px 7px;border-radius:99px;font-weight:700;
  }

  .main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
  .content{flex:1;padding-bottom:96px;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    background:var(--paper);
    padding:18px 18px 12px;
    display:flex;align-items:center;gap:10px;
    border-bottom:1px solid transparent;
  }
  .topbar.with-line{border-color:var(--line);}
  .icon-btn{
    width:38px;height:38px;border-radius:12px;border:1px solid var(--line);
    background:var(--white);display:flex;align-items:center;justify-content:center;
    cursor:pointer;color:var(--ink); flex-shrink:0;
  }
  .icon-btn svg{width:18px;height:18px;}
  .topbar h1{font-size:19px;flex:1;}
  .pill-btn{
    display:flex;align-items:center;gap:6px;
    background:var(--sage);color:#fff;border:none;border-radius:99px;
    padding:9px 15px;font-size:13.5px;font-weight:700;cursor:pointer;
    white-space:nowrap;
  }
  .pill-btn svg{width:14px;height:14px;}
  .pill-btn.ghost{background:var(--white);color:var(--sage-deep);border:1px solid var(--line);}

  /* ---------- Home ---------- */
  .greeting{padding:2px 18px 18px;}
  .greeting .hi{font-size:22px;}
  .greeting .sub{color:var(--ink-soft);font-size:13.5px;margin-top:4px;}

  .stat-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 18px 6px;
  }
  .stat-card{
    background:var(--white);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px;cursor:pointer;transition:transform .12s ease;
  }
  .stat-card:active{transform:scale(.97);}
  .stat-card .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .stat-card .icon-wrap{
    width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  }
  .stat-card .icon-wrap svg{width:18px;height:18px;}
  .stat-card .num{font-size:26px;font-weight:800;line-height:1;}
  .stat-card .label{font-size:12.5px;color:var(--ink-soft);margin-top:6px;}
  .stat-card .flag{font-size:11.5px;font-weight:700;margin-top:8px;display:inline-block;padding:2px 8px;border-radius:99px;}

  .section-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:22px 18px 10px;
  }
  .section-head h2{font-size:15.5px;}
  .link-btn{background:none;border:none;color:var(--sage-deep);font-size:13px;font-weight:700;cursor:pointer;}

  .task-list{padding:0 18px;display:flex;flex-direction:column;gap:8px;}
  .task-row{
    display:flex;align-items:center;gap:12px;background:var(--white);
    border:1px solid var(--line);border-radius:14px;padding:11px 13px;cursor:pointer;
  }
  .task-row .dot{width:32px;height:32px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .task-row .dot svg{width:16px;height:16px;}
  .task-row .body{flex:1;min-width:0;}
  .task-row .name{font-size:14px;font-weight:700;}
  .task-row .desc{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .task-row .tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;white-space:nowrap;}

  .activity-row{
    display:flex;align-items:center;gap:12px;padding:11px 13px;
  }
  .activity-row .ic{width:30px;height:30px;border-radius:8px;background:var(--sage-pale);color:var(--sage-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .activity-row .ic svg{width:15px;height:15px;}
  .activity-row .txt{flex:1;font-size:13px;}
  .activity-row .date{font-size:11.5px;color:var(--ink-soft);}

  /* ---------- Inventory ---------- */
  .search-wrap{padding:0 18px 12px;display:flex;gap:10px;}
  .search-box{
    flex:1;display:flex;align-items:center;gap:8px;background:var(--white);
    border:1px solid var(--line);border-radius:13px;padding:10px 13px;
  }
  .search-box svg{width:16px;height:16px;color:var(--ink-soft);flex-shrink:0;}
  .search-box input{border:none;outline:none;background:transparent;font-size:14px;width:100%;color:var(--ink);font-family:inherit;}

  .chip-row{display:flex;gap:8px;padding:0 18px 14px;overflow-x:auto;}
  .chip{
    flex-shrink:0;padding:8px 14px;border-radius:99px;border:1px solid var(--line);
    background:var(--white);font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;
  }
  .chip.active{background:var(--ink);color:#fff;border-color:var(--ink);}

  .card-list{padding:0 18px;display:flex;flex-direction:column;gap:10px;}
  .item-card{
    background:var(--white);border:1px solid var(--line);border-radius:16px;
    padding:13px;display:flex;gap:12px;cursor:pointer;
  }
  .item-card .emoji{
    width:50px;height:50px;border-radius:13px;background:var(--paper-deep);
    display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;
  }
  .item-card .info{flex:1;min-width:0;}
  .item-card .row1{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}
  .item-card .name{font-size:15px;font-weight:700;}
  .item-card .qty{font-size:12.5px;color:var(--ink-soft);margin-top:2px;}
  .tag-pill{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap;}
  .bar-track{height:6px;border-radius:99px;background:var(--paper-deep);margin-top:9px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:99px;}
  .item-card .foot{display:flex;justify-content:space-between;margin-top:6px;font-size:11.5px;color:var(--ink-soft);}

  .empty{padding:40px 18px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  /* ---------- Sub tabs (家電) ---------- */
  .subtabs{display:flex;gap:6px;padding:0 18px 14px;}
  .subtab{
    flex:1;text-align:center;padding:10px 6px;border-radius:12px;border:1px solid var(--line);
    background:var(--white);font-size:13px;font-weight:700;color:var(--ink-soft);cursor:pointer;
  }
  .subtab.active{background:var(--sage);color:#fff;border-color:var(--sage);}

  .appliance-card{
    background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;
    display:flex;gap:12px;align-items:center;cursor:pointer;
  }
  .appliance-card .emoji{width:48px;height:48px;border-radius:12px;background:var(--sage-pale);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;}
  .appliance-card .info{flex:1;min-width:0;}
  .appliance-card .name{font-size:14.5px;font-weight:700;}
  .appliance-card .model{font-size:12px;color:var(--ink-soft);margin-top:1px;}
  .appliance-card .date{font-size:11.5px;color:var(--ink-soft);margin-top:5px;}

  .repair-entry{
    display:flex;gap:12px;padding:13px;background:var(--white);border:1px solid var(--line);border-radius:16px;
  }
  .repair-entry .rail{display:flex;flex-direction:column;align-items:center;padding-top:3px;}
  .repair-entry .rail .node{width:9px;height:9px;border-radius:50%;background:var(--sage);flex-shrink:0;}
  .repair-entry.pending .rail .node{background:var(--coral);}
  .repair-entry .rail .line{flex:1;width:1.5px;background:var(--line);margin-top:4px;}
  .repair-entry .body{flex:1;padding-bottom:2px;}
  .repair-entry .date{font-size:12px;color:var(--ink-soft);font-weight:700;}
  .repair-entry .title{font-size:14px;font-weight:700;margin-top:3px;}
  .repair-entry .meta{font-size:12.5px;color:var(--ink-soft);margin-top:3px;}

  .consumable-card{
    background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px;
    display:flex;justify-content:space-between;align-items:flex-start;gap:10px;
  }
  .consumable-card .name{font-size:14.5px;font-weight:700;}
  .consumable-card .meta{font-size:12px;color:var(--ink-soft);margin-top:4px;}
  .consumable-card .meta2{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}

  /* ---------- Shopping list ---------- */
  .shop-row{
    display:flex;align-items:center;gap:12px;background:var(--white);border:1px solid var(--line);
    border-radius:15px;padding:12px 13px;
  }
  .checkbox{
    width:23px;height:23px;border-radius:8px;border:2px solid var(--line);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .checkbox.checked{background:var(--sage);border-color:var(--sage);color:#fff;}
  .checkbox svg{width:13px;height:13px;}
  .shop-row .emoji{width:38px;height:38px;border-radius:10px;background:var(--paper-deep);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
  .shop-row .info{flex:1;}
  .shop-row .name{font-size:14px;font-weight:700;}
  .shop-row.checked .name{text-decoration:line-through;color:var(--ink-soft);}
  .shop-row .cat{font-size:11.5px;color:var(--ink-soft);margin-top:2px;}
  .shop-row .qty{font-size:12.5px;color:var(--ink-soft);}

  .cart-bar{
    position:fixed;left:0;right:0;bottom:76px;z-index:15;
    display:flex;justify-content:center;pointer-events:none;
  }
  .cart-bar .inner{
    max-width:1180px;width:100%;padding:0 18px;pointer-events:none;
  }
  .cart-bar button{
    pointer-events:auto;width:100%;background:var(--sage-deep);color:#fff;border:none;
    border-radius:14px;padding:14px;font-size:14.5px;font-weight:800;box-shadow:var(--shadow);cursor:pointer;
  }

  /* ---------- Item detail sheet ---------- */
  .sheet-overlay{
    position:fixed;inset:0;background:rgba(31,26,20,0.42);z-index:50;
    display:none;align-items:flex-end;justify-content:center;
  }
  .sheet-overlay.open{display:flex;}
  .sheet{
    background:var(--paper);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;
    border-radius:24px 24px 0 0;padding-bottom:24px;
    animation:sheetUp .22s ease;
  }
  @keyframes sheetUp{from{transform:translateY(24px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:16px 16px 6px;}
  .sheet-head h2{flex:1;font-size:17px;}
  .sheet-hero{display:flex;gap:14px;padding:10px 18px 16px;align-items:center;}
  .sheet-hero .emoji{width:70px;height:70px;border-radius:18px;background:var(--paper-deep);display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0;}
  .sheet-hero .name{font-size:19px;font-weight:800;}
  .sheet-hero .min{font-size:12.5px;color:var(--ink-soft);margin-top:4px;}
  .sheet-hero .bar-track{margin-top:8px;width:100%;}

  .detail-list{background:var(--white);border:1px solid var(--line);border-radius:16px;margin:0 18px 16px;overflow:hidden;}
  .detail-row{display:flex;justify-content:space-between;padding:12px 15px;font-size:13.5px;border-bottom:1px solid var(--line);}
  .detail-row:last-child{border-bottom:none;}
  .detail-row .k{color:var(--ink-soft);}
  .detail-row .v{font-weight:700;text-align:right;}

  .stepper{display:flex;align-items:center;justify-content:center;gap:22px;padding:6px 18px 16px;}
  .stepper button{
    width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:var(--white);
    font-size:20px;font-weight:800;cursor:pointer;color:var(--sage-deep);
  }
  .stepper .val{font-size:22px;font-weight:800;min-width:40px;text-align:center;}
  .sheet-actions{display:flex;gap:10px;padding:0 18px;}
  .sheet-actions button{
    flex:1;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--white);
    font-weight:700;font-size:13.5px;cursor:pointer;color:var(--ink);
  }

  /* ---------- Add sheet form ---------- */
  .form-row{padding:0 18px 12px;}
  .form-row label{font-size:12.5px;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:6px;}
  .form-row input,.form-row select{
    width:100%;padding:11px 13px;border-radius:12px;border:1px solid var(--line);
    background:var(--white);font-size:14px;font-family:inherit;color:var(--ink);outline:none;
  }
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 18px 12px;}
  .form-grid .form-row{padding:0;}

  /* ---------- More sheet ---------- */
  .more-list{padding:6px 18px;display:flex;flex-direction:column;gap:8px;}
  .more-row{display:flex;align-items:center;gap:13px;background:var(--white);border:1px solid var(--line);border-radius:15px;padding:14px;cursor:pointer;}
  .more-row .ic{width:38px;height:38px;border-radius:11px;background:var(--sage-pale);color:var(--sage-deep);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .more-row .ic svg{width:19px;height:19px;}
  .more-row .t{font-size:14.5px;font-weight:700;flex:1;}
  .more-row svg.chev{width:16px;height:16px;color:var(--ink-soft);}

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    background:rgba(250,247,239,0.94);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    display:flex;justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
  }
  .bottom-nav .inner{max-width:1180px;width:100%;display:flex;}
  .nav-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:10px 4px 8px;background:none;border:none;cursor:pointer;color:var(--ink-soft);
  }
  .nav-btn svg{width:21px;height:21px;}
  .nav-btn span{font-size:10.5px;font-weight:700;}
  .nav-btn.active{color:var(--sage-deep);}

  @media (min-width:900px){
    .sidebar{display:flex;}
    .bottom-nav{display:none;}
    .content{padding-bottom:40px;}
    .cart-bar{bottom:24px;}
    .app{border-left:1px solid var(--line);border-right:1px solid var(--line);}
  }
  @media (max-width:899px){
    .sidebar{display:none;}
  }

  .toast{
    position:fixed;left:50%;bottom:100px;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;font-weight:700;
    z-index:80;opacity:0;pointer-events:none;transition:opacity .2s ease, bottom .2s ease;
  }
  .toast.show{opacity:1;bottom:110px;}
</style>
</head>
<body>

<div class="app">
  <!-- Desktop sidebar -->
  <nav class="sidebar">
    <div class="brand"><div class="mark">🏡</div><span>家管誌</span></div>
    <div class="greet">簡潔易用．重點提醒．快速操作</div>
    <button class="side-link" data-nav="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>首頁</button>
    <button class="side-link" data-nav="inventory"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16l-1.5 12.5a1 1 0 0 1-1 .9H6.5a1 1 0 0 1-1-.9L4 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>庫存清單</button>
    <button class="side-link" data-nav="shopping"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 3h3l1 3"/></svg>採購清單</button>
    <button class="side-link" data-nav="appliances"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8"/><circle cx="8" cy="15.5" r="1"/></svg>家電管理</button>
    <div style="height:8px"></div>
    <div style="font-size:11px;color:#BFD8CC;padding:6px 12px 2px;font-weight:700;">更多</div>
    <button class="side-link" data-nav="repairs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3l7 7-8.5 8.5-4-4L17 5z"/><path d="M5 21l3-3"/></svg>維修紀錄</button>
    <button class="side-link" data-nav="consumables"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>耗材更換</button>
  </nav>

  <div class="main-col">
    <div class="content" id="content"></div>
  </div>
</div>

<!-- Item detail sheet -->
<div class="sheet-overlay" id="itemSheetOverlay">
  <div class="sheet" id="itemSheet"></div>
</div>

<!-- Add item sheet -->
<div class="sheet-overlay" id="addSheetOverlay">
  <div class="sheet" id="addSheet"></div>
</div>

<!-- More sheet (mobile only, mirrors sidebar extra links) -->
<div class="sheet-overlay" id="moreSheetOverlay">
  <div class="sheet" id="moreSheet"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Mobile bottom nav -->
<nav class="bottom-nav">
  <div class="inner">
    <button class="nav-btn" data-nav="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>首頁</span>
    </button>
    <button class="nav-btn" data-nav="inventory">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16l-1.5 12.5a1 1 0 0 1-1 .9H6.5a1 1 0 0 1-1-.9L4 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg>
      <span>庫存</span>
    </button>
    <button class="nav-btn" data-nav="shopping">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 3h3l1 3"/></svg>
      <span>採購清單</span>
    </button>
    <button class="nav-btn" data-nav="appliances">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h8M8 11h8"/><circle cx="8" cy="15.5" r="1"/></svg>
      <span>家電</span>
    </button>
    <button class="nav-btn" data-nav="more">

<script>
(function(){

    cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6h15l-1.5 9h-12z"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/><path d="M3 3h3l1 3"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M4 12l5 5 11-11"/></svg>',

    edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>',
    dots:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>'
  };

  var TODAY = new Date(2026,7,23); // 2026-08-23

  function daysUntil(dateStr){
    if(!dateStr) return null;
    var d = new Date(dateStr+"T00:00:00");
    return Math.round((d - TODAY)/86400000);
  }
  function fmtDate(dateStr){
    if(!dateStr) return "—";
    return dateStr.replace(/-/g,"/");
  }

  /* ---------------- Default data ---------------- */
  function defaultState(){
    return {
      fridge: [
        {id:"f1", name:"雞蛋", emoji:"🥚", qty:2, unit:"顆", min:4, location:"冰箱冷藏室", expiry:"2026-08-25", lastPurchase:"2026-08-15", avg:"約 1.5 顆 / 天", note:""},
        {id:"f2", name:"鮮奶", emoji:"🥛", qty:1, unit:"瓶", min:2, location:"冰箱冷藏室", expiry:"2026-08-25", lastPurchase:"2026-08-10", avg:"約 0.5 瓶 / 天", note:""},
        {id:"f3", name:"高麗菜", emoji:"🥬", qty:1, unit:"顆", min:2, location:"冰箱冷藏室", expiry:"2026-08-27", lastPurchase:"2026-08-13", avg:"約 0.2 顆 / 天", note:""},
        {id:"f4", name:"牛番茄", emoji:"🍅", qty:3, unit:"顆", min:5, location:"冰箱冷藏室", expiry:"2026-08-29", lastPurchase:"2026-08-16", avg:"約 0.8 顆 / 天", note:""},
        {id:"f5", name:"豬肉片", emoji:"🥩", qty:200, unit:"g", min:500, location:"冰箱冷凍室", expiry:"2026-08-22", lastPurchase:"2026-08-12", avg:"約 100 g / 天", note:""}
      ],
      daily: [
        {id:"d1", name:"衛生紙", emoji:"🧻", qty:1, unit:"包", min:3, location:"儲藏室", expiry:null, lastPurchase:"2026-08-20", avg:"約 0.3 包 / 天", note:""},
        {id:"d2", name:"洗衣精", emoji:"🧴", qty:1, unit:"瓶", min:1, location:"陽台", expiry:null, lastPurchase:"2026-07-28", avg:"約 0.1 瓶 / 天", note:""},
        {id:"d3", name:"垃圾袋", emoji:"🗑️", qty:1, unit:"包", min:2, location:"廚房", expiry:null, lastPurchase:"2026-08-05", avg:"約 0.2 包 / 天", note:""}
      ],
      appliances: [
        {id:"a1", name:"Panasonic 冰箱", model:"NR-BX461", emoji:"🧊", status:"保固內", purchase:"2022/08/15"},
        {id:"a2", name:"LG 洗衣機", model:"WT-VD123", emoji:"🌀", status:"待維修", purchase:"2024/02/10"},
        {id:"a3", name:"日立冷氣", model:"RAS-50YK", emoji:"❄️", status:"保固內", purchase:"2022/06/20"},
        {id:"a4", name:"Samsung 電視", model:"QA65Q80A", emoji:"📺", status:"保固內", purchase:"2023/05/05"}
      ],
      repairs: [
        {id:"r1", applianceId:"a2", date:"2026/08/21", title:"無法脫水", status:"處理中", cost:"預估費用 $2,000", vendor:"等待維修報價"},
        {id:"r2", applianceId:"a2", date:"2026/06/15", title:"更換排水馬達", status:"完成", cost:"維修費 $1,800", vendor:"大同維修中心"},
        {id:"r3", applianceId:"a2", date:"2025/12/10", title:"更換進水閥", status:"完成", cost:"維修費 $1,200", vendor:"大同維修中心"}
      ],
      consumables: [
        {id:"c1", applianceId:"a1", name:"冰箱濾芯", cycle:"建議每 6 個月更換", nextDate:"2026-11-20"},
        {id:"c2", applianceId:"a3", name:"空氣清淨機濾網", cycle:"建議每 6-12 個月更換", nextDate:"2026-08-28"},
        {id:"c3", applianceId:"a3", name:"冷氣濾網", cycle:"建議每 3 個月更換", nextDate:"2026-09-18"},
        {id:"c4", applianceId:"a2", name:"洗衣機濾網", cycle:"建議每 2 個月更換", nextDate:"2026-10-05"}
      ],
      shopping: [
        {id:"s1", name:"衛生紙", emoji:"🧻", qty:"2 串", cat:"日用品", checked:true},
        {id:"s2", name:"洗衣精", emoji:"🧴", qty:"1 瓶", cat:"日用品", checked:true},
        {id:"s3", name:"雞蛋", emoji:"🥚", qty:"1 盒", cat:"超市", checked:false},
        {id:"s4", name:"牛奶", emoji:"🥛", qty:"2 瓶", cat:"超市", checked:false},
        {id:"s5", name:"垃圾袋", emoji:"🗑️", qty:"1 包", cat:"日用品", checked:false},
        {id:"s6", name:"泡麵", emoji:"🍜", qty:"2 包", cat:"Costco", checked:false}
      ],
      activity: [
        {id:"act1", text:"買入衛生紙 2 串", date:"08/20"}
      ]
    };
  }

  var state = defaultState();
  var uid = function(p){ return p + Math.random().toString(36).slice(2,8); };

  /* ---------------- Storage ---------------- */
  function saveState(){
    try{
      if(window.storage && window.storage.set){
        window.storage.set("family-home-state", JSON.stringify(state), false).catch(function(){});
      }
    }catch(e){ /* ignore, keep working in-memory */ }
  }
  function loadState(cb){
    try{
      if(window.storage && window.storage.get){
        window.storage.get("family-home-state", false).then(function(res){
          if(res && res.value){
            try{
              var parsed = JSON.parse(res.value);
              if(parsed && parsed.fridge) state = parsed;
            }catch(e){}
          }
          cb();
        }).catch(function(){ cb(); });
        return;
      }
    }catch(e){}
    cb();
  }

  /* ---------------- Helpers ---------------- */
  function statusOf(item){
    var pct = Math.round((item.qty / item.min) * 100);
    var d = daysUntil(item.expiry);
    var expiring = (d !== null && d <= 3);
    var low = item.qty <= item.min;
    var kind = "ok";
    if(low) kind = "low";
    else if(expiring) kind = "soon";
    return {pct: Math.min(pct,100), low: low, expiring: expiring, kind: kind, days: d};
  }
  function barColor(kind){
    if(kind === "low") return "var(--coral)";
    if(kind === "soon") return "var(--amber)";
    return "var(--sage)";
  }
  function tagFor(kind, days){
    if(kind === "low") return {text:"低庫存", bg:"var(--coral-pale)", fg:"var(--coral)"};
    if(kind === "soon") return {text: days<=0 ? "已到期" : "即將到期", bg:"var(--amber-pale)", fg:"var(--amber)"};
    return null;
  }
  function allInventory(){ return state.fridge.concat(state.daily); }
  function findItem(id){ return allInventory().find(function(i){return i.id===id;}); }
  function findAppliance(id){ return state.appliances.find(function(a){return a.id===id;}); }

  function showToast(msg){
    var t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(function(){ t.classList.remove("show"); }, 1800);
  }

  /* ---------------- Router ---------------- */
  var route = {name:"home", params:{}};
  var invTab = "fridge"; // fridge | daily
  var invFilter = "all"; // all | low | soon
  var applianceTab = "list"; // list | repairs | consumables
  var selectedApplianceForRepairs = null;

  function nav(name, params){
    route = {name:name, params:params||{}};
    document.querySelectorAll(".nav-btn, .side-link").forEach(function(b){
      b.classList.toggle("active", b.dataset.nav === name || (name==="more" && b.dataset.nav==="more"));
    });
    render();
    document.getElementById("content").scrollTop = 0;
    window.scrollTo(0,0);
  }

  document.querySelectorAll("[data-nav]").forEach(function(el){
    el.addEventListener("click", function(){
      var target = el.dataset.nav;
      if(target === "more"){ openMoreSheet(); return; }
      nav(target);
    });
  });

  /* ---------------- Renderers ---------------- */
  var content = document.getElementById("content");

  function render(){
    if(route.name === "home") return renderHome();
    if(route.name === "inventory") return renderInventory();
    if(route.name === "shopping") return renderShopping();
    if(route.name === "appliances") return renderAppliances();
    if(route.name === "repairs"){ applianceTab="repairs"; return renderAppliances(); }
    if(route.name === "consumables"){ applianceTab="consumables"; return renderAppliances(); }
  }

  function renderHome(){
    var lowFridge = state.fridge.filter(function(i){return statusOf(i).low;}).length;
    var lowDaily = state.daily.filter(function(i){return statusOf(i).low;}).length;
    var upcomingConsumables = state.consumables.filter(function(c){ var d=daysUntil(c.nextDate); return d!==null && d<=14; }).length;
    var pendingRepairs = state.repairs.filter(function(r){return r.status==="處理中";}).length;

    var attentionCount = lowFridge + lowDaily + upcomingConsumables + pendingRepairs;

    var needsAttention = [];
    state.fridge.concat(state.daily).forEach(function(i){
      var s = statusOf(i);
      if(s.low || s.expiring){
        needsAttention.push({
          icon: ICONS.box, bg:"var(--sage-pale)", fg:"var(--sage-deep)",
          name: i.name, desc: s.low ? "剩 "+i.qty+" "+i.unit : "到期日 "+fmtDate(i.expiry).slice(5),
          tag: s.low ? "需要補貨" : "即將到期", tagBg: s.low ? "var(--coral-pale)":"var(--amber-pale)", tagFg: s.low?"var(--coral)":"var(--amber)",
          onClick: function(){ openItemSheet(i.id); }
        });
      }
    });
    state.consumables.forEach(function(c){
      var d = daysUntil(c.nextDate);
      if(d!==null && d<=14){
        needsAttention.push({
          icon: ICONS.clock, bg:"var(--amber-pale)", fg:"var(--amber)",
          name: c.name, desc: d<=0 ? "已超過建議更換時間" : "上次建議："+c.cycle,
          tag: d<=0?"已到期":(d+" 天內到期"), tagBg:"var(--amber-pale)", tagFg:"var(--amber)",
          onClick: function(){ nav("consumables"); }
        });
      }
    });
    state.repairs.filter(function(r){return r.status==="處理中";}).forEach(function(r){
      var app = findAppliance(r.applianceId);
      needsAttention.push({
        icon: ICONS.wrench, bg:"var(--coral-pale)", fg:"var(--coral)",
        name: (app?app.name:"") + " · " + r.title, desc: r.cost,
        tag:"處理中", tagBg:"var(--coral-pale)", tagFg:"var(--coral)",
        onClick: function(){ nav("repairs"); }
      });
    });

    var html = "";
    html += '<div class="topbar">'
      + '<h1>我的家</h1>'
      + '<button class="icon-btn">' + ICONS.bell + '</button>'
      + '</div>';

    html += '<div class="greeting"><div class="hi">早安 👋</div>'
      + '<div class="sub">今天有 <b style="color:var(--coral)">'+attentionCount+'</b> 件事情需要注意喔！</div></div>';

    html += '<div class="stat-grid">';
    html += statCard(ICONS.box, "var(--sage-pale)", "var(--sage-deep)", state.fridge.length, "冰箱庫存", lowFridge?lowFridge+" 項低庫存":null, "inventory", "fridge");
    html += statCard(ICONS.box, "var(--sage-pale)", "var(--sage-deep)", state.daily.length, "日用品庫存", lowDaily?lowDaily+" 項低庫存":null, "inventory", "daily");
    html += statCard(ICONS.clock, "var(--amber-pale)", "var(--amber)", state.consumables.length, "待更換耗材", upcomingConsumables?upcomingConsumables+" 項將到期":null, "consumables", null);
    html += statCard(ICONS.wrench, "var(--coral-pale)", "var(--coral)", state.appliances.length, "家電總數", pendingRepairs?pendingRepairs+" 件待維修":null, "appliances", null);
    html += '</div>';

    html += '<div class="section-head"><h2>最近需要處理</h2><button class="link-btn" id="seeAllAttention">查看全部</button></div>';
    html += '<div class="task-list">';
    if(needsAttention.length===0){
      html += '<div class="empty">目前沒有需要特別注意的事項，太棒了！</div>';
    } else {
      needsAttention.slice(0,5).forEach(function(t,idx){
        html += '<div class="task-row" data-attn="'+idx+'">'
          + '<div class="dot" style="background:'+t.bg+';color:'+t.fg+'">'+t.icon+'</div>'
          + '<div class="body"><div class="name">'+t.name+'</div><div class="desc">'+t.desc+'</div></div>'
          + '<div class="tag" style="background:'+t.tagBg+';color:'+t.tagFg+'">'+t.tag+'</div>'
          + '</div>';
      });
    }
    html += '</div>';

    html += '<div class="section-head"><h2>最近活動</h2></div>';
    html += '<div class="card-list" style="gap:2px;">';
    if(state.activity.length===0){
      html += '<div class="empty">尚無活動紀錄</div>';
    } else {
      state.activity.slice(0,5).forEach(function(a){
        html += '<div class="activity-row"><div class="ic">🛒</div><div class="txt">'+a.text+'</div><div class="date">'+a.date+'</div></div>';
      });
    }
    html += '</div><div style="height:8px"></div>';

    content.innerHTML = html;

    window.__attnList = needsAttention;
    content.querySelectorAll("[data-attn]").forEach(function(el){
      el.addEventListener("click", function(){
        window.__attnList[+el.dataset.attn].onClick();
      });
    });
    content.querySelectorAll("[data-goto]").forEach(function(el){
      el.addEventListener("click", function(){
        nav(el.dataset.goto, {tab: el.dataset.tab});
        if(el.dataset.goto==="inventory" && el.dataset.tab){ invTab = el.dataset.tab; renderInventory(); }
      });
    });
    var seeAll = document.getElementById("seeAllAttention");
    if(seeAll) seeAll.addEventListener("click", function(){ nav("inventory"); });
  }

  function statCard(icon,bg,fg,num,label,flag,gotoName,tab){
    return '<div class="stat-card" data-goto="'+gotoName+'" '+(tab?'data-tab="'+tab+'"':'')+'>'
      + '<div class="top"><div class="icon-wrap" style="background:'+bg+';color:'+fg+'">'+icon+'</div></div>'
      + '<div class="num">'+num+'</div><div class="label">'+label+'</div>'
      + (flag?'<div class="flag" style="background:var(--coral-pale);color:var(--coral)">'+flag+'</div>':'')
      + '</div>';
  }

  function renderInventory(){
    var list = invTab === "fridge" ? state.fridge : state.daily;
    var lowCount = list.filter(function(i){return statusOf(i).low;}).length;
    var soonCount = list.filter(function(i){return statusOf(i).expiring;}).length;

    var filtered = list.filter(function(i){
      if(invFilter==="low") return statusOf(i).low;
      if(invFilter==="soon") return statusOf(i).expiring;
      return true;
    });

    var html = '';
    html += '<div class="topbar with-line">'
      + '<h1>庫存清單</h1>'
      + '<button class="pill-btn" id="addItemBtn">'+ICONS.plus+' 新增</button>'
      + '</div>';

    html += '<div class="subtabs" style="padding-top:14px;">'
      + subtabBtn("fridge","🧊 冰箱庫存", invTab)
      + subtabBtn("daily","🧻 日用品庫存", invTab)
      + '</div>';

    html += '<div class="search-wrap"><div class="search-box">'+ICONS.search+'<input placeholder="搜尋商品" id="invSearch"></div></div>';

    html += '<div class="chip-row">'
      + chip("all","全部 ("+list.length+")", invFilter)
      + chip("low","低庫存 ("+lowCount+")", invFilter)
      + chip("soon","即將到期 ("+soonCount+")", invFilter)
      + '</div>';

    html += '<div class="card-list" id="invCardList">';
    if(filtered.length===0){
      html += '<div class="empty">沒有符合條件的品項</div>';
    } else {
      filtered.forEach(function(i){ html += itemCardHtml(i); });
    }
    html += '</div><div style="height:8px"></div>';

    content.innerHTML = html;

    document.getElementById("addItemBtn").addEventListener("click", function(){ openAddSheet(invTab); });
    content.querySelectorAll("[data-subtab]").forEach(function(el){
      el.addEventListener("click", function(){ invTab = el.dataset.subtab; invFilter="all"; renderInventory(); });
    });
    content.querySelectorAll("[data-chip]").forEach(function(el){
      el.addEventListener("click", function(){ invFilter = el.dataset.chip; renderInventory(); });
    });
    content.querySelectorAll("[data-item]").forEach(function(el){
      el.addEventListener("click", function(){ openItemSheet(el.dataset.item); });
    });
    var searchInput = document.getElementById("invSearch");
    searchInput.addEventListener("input", function(){
      var q = searchInput.value.trim();
      var cardList = document.getElementById("invCardList");
      var subset = filtered.filter(function(i){ return i.name.indexOf(q) !== -1; });
      cardList.innerHTML = subset.length ? subset.map(itemCardHtml).join("") : '<div class="empty">找不到符合的商品</div>';
      cardList.querySelectorAll("[data-item]").forEach(function(el){
        el.addEventListener("click", function(){ openItemSheet(el.dataset.item); });
      });
    });
  }

  function subtabBtn(val,label,current){
    return '<div class="subtab '+(val===current?'active':'')+'" data-subtab="'+val+'">'+label+'</div>';
  }
  function chip(val,label,current){
    return '<div class="chip '+(val===current?'active':'')+'" data-chip="'+val+'">'+label+'</div>';
  }

  function itemCardHtml(i){
    var s = statusOf(i);
    var tag = tagFor(s.kind, s.days);
    var footRight = i.expiry ? "到期日 "+fmtDate(i.expiry).slice(5) : "";
    return '<div class="item-card" data-item="'+i.id+'">'
      + '<div class="emoji">'+i.emoji+'</div>'
      + '<div class="info">'
      +   '<div class="row1"><div><div class="name">'+i.name+'</div>'
      +     '<div class="qty">'+i.qty+' '+i.unit+' / 最低庫存 '+i.min+' '+i.unit+'</div></div>'
      +     (tag?'<div class="tag-pill" style="background:'+tag.bg+';color:'+tag.fg+'">'+tag.text+'</div>':'')
      +   '</div>'
      +   '<div class="bar-track"><div class="bar-fill" style="width:'+s.pct+'%;background:'+barColor(s.kind)+'"></div></div>'
      +   '<div class="foot"><span>'+s.pct+'%</span><span>'+footRight+'</span></div>'
      + '</div></div>';
  }

  function renderAppliances(){
    var html = '';
    html += '<div class="topbar with-line">'
      + '<h1>家電管理</h1>'
      + '<button class="pill-btn" id="addApplianceBtn">'+ICONS.plus+' 新增</button>'
      + '</div>';

    html += '<div class="subtabs" style="padding-top:14px;">'
      + subtab2("list","家電清單")
      + subtab2("repairs","維修紀錄")
      + subtab2("consumables","耗材更換")
      + '</div>';

    if(applianceTab === "list"){
      html += '<div class="card-list">';
      state.appliances.forEach(function(a){
        var statusColor = a.status==="待維修" ? {bg:"var(--coral-pale)",fg:"var(--coral)"} : {bg:"var(--sage-pale)",fg:"var(--sage-deep)"};
        html += '<div class="appliance-card" data-appl="'+a.id+'">'
          + '<div class="emoji">'+a.emoji+'</div>'
          + '<div class="info"><div class="name">'+a.name+'</div><div class="model">'+a.model+'</div>'
          + '<div class="date">購入日 '+a.purchase+'</div></div>'
          + '<div class="tag-pill" style="background:'+statusColor.bg+';color:'+statusColor.fg+'">'+a.status+'</div>'
          + '</div>';
      });
      html += '</div>';
    } else if(applianceTab === "repairs"){
      html += '<div class="chip-row">' + chip("__all","全部家電", selectedApplianceForRepairs || "__all");
      state.appliances.forEach(function(a){ html += chip(a.id, a.name, selectedApplianceForRepairs || "__all"); });
      html += '</div>';
      var repairList = state.repairs.filter(function(r){
        return !selectedApplianceForRepairs || selectedApplianceForRepairs==="__all" || r.applianceId===selectedApplianceForRepairs;
      });
      html += '<div class="card-list">';
      if(repairList.length===0){
        html += '<div class="empty">尚無維修紀錄</div>';
      } else {
        repairList.forEach(function(r, idx){
          var app = findAppliance(r.applianceId);
          html += '<div class="repair-entry '+(r.status==="處理中"?"pending":"")+'">'
            + '<div class="rail"><div class="node"></div>'+(idx<repairList.length-1?'<div class="line"></div>':'')+'</div>'
            + '<div class="body"><div class="date">'+r.date+(app?" · "+app.name:"")+'</div>'
            + '<div class="title">'+r.title+ (r.status==="處理中" ? '  <span class="tag-pill" style="background:var(--coral-pale);color:var(--coral)">處理中</span>' : '') +'</div>'
            + '<div class="meta">'+r.cost+'</div><div class="meta">'+r.vendor+'</div></div>'
            + '</div>';
        });
      }
      html += '</div>';
    } else if(applianceTab === "consumables"){
      html += '<div class="chip-row">'
        + chip("all","全部 ("+state.consumables.length+")", invFilter==="cons_all"?"all":"all")
        + '</div>';
      html += '<div class="card-list">';
      state.consumables.slice().sort(function(a,b){ return daysUntil(a.nextDate)-daysUntil(b.nextDate); }).forEach(function(c){
        var d = daysUntil(c.nextDate);
        var app = findAppliance(c.applianceId);
        var tagText, tagBg, tagFg;
        if(d<=0){ tagText="已到期"; tagBg="var(--coral-pale)"; tagFg="var(--coral)"; }
        else if(d<=7){ tagText="剩 "+d+" 天"; tagBg="var(--coral-pale)"; tagFg="var(--coral)"; }
        else if(d<=30){ tagText="剩 "+d+" 天"; tagBg="var(--amber-pale)"; tagFg="var(--amber)"; }
        else { tagText="正常"; tagBg="var(--sage-pale)"; tagFg="var(--sage-deep)"; }
        html += '<div class="consumable-card"><div>'
          + '<div class="name">'+c.name+(app?' · '+app.name:'')+'</div>'
          + '<div class="meta">'+c.cycle+'</div>'
          + '<div class="meta2">下次更換 '+fmtDate(c.nextDate)+'</div>'
          + '</div><div class="tag-pill" style="background:'+tagBg+';color:'+tagFg+'">'+tagText+'</div></div>';
      });
      html += '</div>';
    }
    html += '<div style="height:8px"></div>';

    content.innerHTML = html;
    document.getElementById("addApplianceBtn").addEventListener("click", function(){ showToast("可於「家電清單」新增家電（示範版尚未開放表單）"); });
    content.querySelectorAll("[data-subtab2]").forEach(function(el){
      el.addEventListener("click", function(){ applianceTab = el.dataset.subtab2; renderAppliances(); });
    });
    content.querySelectorAll("[data-appl]").forEach(function(el){
      el.addEventListener("click", function(){ selectedApplianceForRepairs = el.dataset.appl; applianceTab="repairs"; renderAppliances(); });
    });
    content.querySelectorAll("[data-chip]").forEach(function(el){
      el.addEventListener("click", function(){ selectedApplianceForRepairs = el.dataset.chip; renderAppliances(); });
    });
  }
  function subtab2(val,label){
    return '<div class="subtab '+(val===applianceTab?'active':'')+'" data-subtab2="'+val+'">'+label+'</div>';
  }

  function renderShopping(){
    var cats = ["全部"].concat(Array.from(new Set(state.shopping.map(function(s){return s.cat;}))));
    if(!window.__shopCat) window.__shopCat = "全部";
    var filtered = state.shopping.filter(function(s){ return window.__shopCat==="全部" || s.cat===window.__shopCat; });
    var checkedCount = state.shopping.filter(function(s){return s.checked;}).length;

    var html = '';
    html += '<div class="topbar with-line"><h1>採購清單</h1>'
      + '<button class="pill-btn" id="addShopBtn">'+ICONS.plus+' 新增</button></div>';

    html += '<div class="chip-row">';
    cats.forEach(function(c){
      var count = c==="全部" ? state.shopping.length : state.shopping.filter(function(s){return s.cat===c;}).length;
      html += '<div class="chip '+(c===window.__shopCat?'active':'')+'" data-shopcat="'+c+'">'+c+' ('+count+')</div>';
    });
    html += '</div>';

    html += '<div class="card-list" id="shopList">';
    if(filtered.length===0){
      html += '<div class="empty">清單目前是空的</div>';
    } else {
      filtered.forEach(function(s){ html += shopRowHtml(s); });
    }
    html += '</div><div style="height:100px"></div>';

    html += '<div class="cart-bar"><div class="inner"><button id="cartBtn">加入購物車 ('+checkedCount+')</button></div></div>';

    content.innerHTML = html;

    document.getElementById("addShopBtn").addEventListener("click", openAddShopPrompt);
    document.getElementById("cartBtn").addEventListener("click", function(){
      showToast("已加入購物車 "+checkedCount+" 項");
    });
    content.querySelectorAll("[data-shopcat]").forEach(function(el){
      el.addEventListener("click", function(){ window.__shopCat = el.dataset.shopcat; renderShopping(); });
    });
    bindShopRows();
  }
  function shopRowHtml(s){
    return '<div class="shop-row '+(s.checked?'checked':'')+'" data-shop="'+s.id+'">'
      + '<div class="checkbox '+(s.checked?'checked':'')+'" data-shopcheck="'+s.id+'">'+(s.checked?ICONS.check:'')+'</div>'
      + '<div class="emoji">'+s.emoji+'</div>'
      + '<div class="info"><div class="name">'+s.name+'</div><div class="cat">'+s.cat+'</div></div>'
      + '<div class="qty">'+s.qty+'</div>'
      + '</div>';
  }
  function bindShopRows(){
    content.querySelectorAll("[data-shopcheck]").forEach(function(el){
      el.addEventListener("click", function(e){
        e.stopPropagation();
        var id = el.dataset.shopcheck;
        var item = state.shopping.find(function(s){return s.id===id;});
        item.checked = !item.checked;
        saveState();
        renderShopping();
      });
    });
  }
  function openAddShopPrompt(){
    var name = prompt("要加入採購清單的品項名稱？");
    if(!name) return;
    state.shopping.unshift({id:uid("s"), name:name, emoji:"🛒", qty:"1", cat:"超市", checked:false});
    saveState();
    renderShopping();
    showToast("已新增「"+name+"」到採購清單");
  }

  /* ---------------- Item detail sheet ---------------- */
  var itemOverlay = document.getElementById("itemSheetOverlay");
  var itemSheetEl = document.getElementById("itemSheet");

  function openItemSheet(id){
    var item = findItem(id);
    if(!item) return;
    var s = statusOf(item);
    var tag = tagFor(s.kind, s.days);
    var html = '';
    html += '<div class="sheet-head"><button class="icon-btn" id="closeItemSheet">'+ICONS.back+'</button><h2>品項詳情</h2><button class="icon-btn">'+ICONS.edit+'</button></div>';
    html += '<div class="sheet-hero"><div class="emoji">'+item.emoji+'</div><div style="flex:1">'
      + '<div style="display:flex;align-items:center;gap:8px;"><div class="name">'+item.name+'</div>'+(tag?'<span class="tag-pill" style="background:'+tag.bg+';color:'+tag.fg+'">'+tag.text+'</span>':'')+'</div>'
      + '<div class="min">最低庫存 '+item.min+' '+item.unit+'</div>'
      + '<div class="bar-track"><div class="bar-fill" style="width:'+s.pct+'%;background:'+barColor(s.kind)+'"></div></div>'
      + '</div></div>';

    html += '<div class="detail-list">'
      + detailRow("存放位置", item.location || "—")
      + detailRow("有效期限", item.expiry ? fmtDate(item.expiry) : "—")
      + detailRow("上次購買", item.lastPurchase ? fmtDate(item.lastPurchase) : "—")
      + detailRow("平均消耗", item.avg || "—")
      + detailRow("預估還可使用", item.min ? Math.max(Math.round(item.qty / Math.max(1,(item.min/7))),0)+" 天" : "—")
      + detailRow("備註", item.note || "—")
      + '</div>';

    html += '<div class="stepper">'
      + '<button id="qtyMinus">−</button><div class="val" id="qtyVal">'+item.qty+'</div><button id="qtyPlus">+</button>'
      + '</div>';

    html += '<div class="sheet-actions">'
      + '<button id="useRecordBtn">使用紀錄</button><button id="buyRecordBtn">購買紀錄</button>'
      + '</div>';

    itemSheetEl.innerHTML = html;
    itemOverlay.classList.add("open");

    document.getElementById("closeItemSheet").addEventListener("click", closeItemSheet);
    itemOverlay.addEventListener("click", function(e){ if(e.target===itemOverlay) closeItemSheet(); }, {once:true});

    document.getElementById("qtyMinus").addEventListener("click", function(){ changeQty(item, -1); });
    document.getElementById("qtyPlus").addEventListener("click", function(){ changeQty(item, 1); });
    document.getElementById("useRecordBtn").addEventListener("click", function(){ showToast("使用紀錄：暫無更多歷史資料"); });
    document.getElementById("buyRecordBtn").addEventListener("click", function(){ showToast("購買紀錄：上次購買於 "+fmtDate(item.lastPurchase)); });
  }
  function detailRow(k,v){
    return '<div class="detail-row"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';
  }
  function changeQty(item, delta){
    item.qty = Math.max(0, item.qty + delta);
    document.getElementById("qtyVal").textContent = item.qty;
    saveState();
    // refresh bar
    var s = statusOf(item);
    var track = itemSheetEl.querySelector(".sheet-hero .bar-fill");
    if(track){ track.style.width = s.pct+"%"; track.style.background = barColor(s.kind); }
  }
  function closeItemSheet(){
    itemOverlay.classList.remove("open");
    render();
  }

  /* ---------------- Add item sheet ---------------- */
  var addOverlay = document.getElementById("addSheetOverlay");
  var addSheetEl = document.getElementById("addSheet");

  function openAddSheet(targetTab){
    var html = '';
    html += '<div class="sheet-head"><button class="icon-btn" id="closeAddSheet">'+ICONS.back+'</button><h2>新增品項</h2><div style="width:38px"></div></div>';
    html += '<div class="form-row"><label>品項名稱</label><input id="newName" placeholder="例如：優格"></div>';
    html += '<div class="form-grid">'
      + '<div class="form-row"><label>數量</label><input id="newQty" type="number" value="1" min="0"></div>'
      + '<div class="form-row"><label>單位</label><input id="newUnit" value="個"></div>'
      + '</div>';
    html += '<div class="form-grid">'
      + '<div class="form-row"><label>最低庫存</label><input id="newMin" type="number" value="1" min="0"></div>'
      + '<div class="form-row"><label>有效期限</label><input id="newExpiry" type="date"></div>'
      + '</div>';
    html += '<div class="form-row"><label>存放位置</label><input id="newLoc" placeholder="例如：冰箱冷藏室" value="'+(targetTab==="fridge"?"冰箱冷藏室":"儲藏室")+'"></div>';
    html += '<div class="sheet-actions" style="padding-top:6px;"><button id="saveNewItem" style="background:var(--sage);color:#fff;border:none;">儲存品項</button></div>';

    addSheetEl.innerHTML = html;
    addOverlay.classList.add("open");

    document.getElementById("closeAddSheet").addEventListener("click", closeAddSheet);
    addOverlay.addEventListener("click", function(e){ if(e.target===addOverlay) closeAddSheet(); }, {once:true});

    document.getElementById("saveNewItem").addEventListener("click", function(){
      var name = document.getElementById("newName").value.trim();
      if(!name){ showToast("請輸入品項名稱"); return; }
      var qty = parseFloat(document.getElementById("newQty").value)||0;
      var unit = document.getElementById("newUnit").value.trim()||"個";
      var min = parseFloat(document.getElementById("newMin").value)||1;
      var expiry = document.getElementById("newExpiry").value || null;
      var loc = document.getElementById("newLoc").value.trim();
      var newItem = {id:uid("i"), name:name, emoji:"🧺", qty:qty, unit:unit, min:min, location:loc, expiry:expiry, lastPurchase: "2026-08-23", avg:"—", note:""};
      if(targetTab === "fridge") state.fridge.unshift(newItem); else state.daily.unshift(newItem);
      state.activity.unshift({id:uid("act"), text:"新增品項 "+name, date:"08/23"});
      saveState();
      closeAddSheet();
      renderInventory();
      showToast("已新增「"+name+"」");
    });
  }
  function closeAddSheet(){
    addOverlay.classList.remove("open");
  }

  /* ---------------- More sheet (mobile) ---------------- */
  var moreOverlay = document.getElementById("moreSheetOverlay");
  var moreSheetEl = document.getElementById("moreSheet");
  function openMoreSheet(){
    var html = '<div class="sheet-head"><h2>更多功能</h2><button class="icon-btn" id="closeMoreSheet">'+ICONS.back+'</button></div>';
    html += '<div class="more-list">';
    html += moreRow(ICONS.tv,"家電管理","appliances_list");
    html += moreRow(ICONS.wrench,"維修紀錄","repairs");
    html += moreRow(ICONS.clock,"耗材更換提醒","consumables");
    html += moreRow(ICONS.box,"庫存清單","inventory");
    html += moreRow(ICONS.cart,"採購清單","shopping");
    html += '</div><div style="height:10px"></div>';
    moreSheetEl.innerHTML = html;
    moreOverlay.classList.add("open");
    document.getElementById("closeMoreSheet").addEventListener("click", function(){ moreOverlay.classList.remove("open"); });
    moreOverlay.addEventListener("click", function(e){ if(e.target===moreOverlay) moreOverlay.classList.remove("open"); }, {once:true});
    moreSheetEl.querySelectorAll("[data-morenav]").forEach(function(el){
      el.addEventListener("click", function(){
        moreOverlay.classList.remove("open");
        var target = el.dataset.morenav;
        if(target === "appliances_list"){ applianceTab="list"; nav("appliances"); }
        else nav(target);
      });
    });
  }
  function moreRow(icon,label,target){
    return '<div class="more-row" data-morenav="'+target+'"><div class="ic">'+icon+'</div><div class="t">'+label+'</div>'+ICONS.chev+'</div>';
  }

  /* ---------------- Boot ---------------- */
  function boot(){
    document.querySelectorAll('[data-nav="home"]').forEach(function(b){b.classList.add("active");});
    render();
  }
  loadState(boot);

})();
</script>
</body>
</html>
